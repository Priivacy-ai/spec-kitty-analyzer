name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build release assets
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history + all tags so `tools/release validate` sees the complete
          # tag set (monotonic progression check is meaningless on a shallow clone).
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Build metadata is stamped ONLY for tag-triggered releases. On a manual
          # workflow_dispatch run GITHUB_REF_NAME is a branch name, so we must NOT
          # stamp it (C-006 / INV-2) — leave LDFLAGS_META empty so binaries keep the
          # dev/none/unknown sentinels.
          PKG=github.com/priivacy-ai/spec-kitty-analyzer/internal/analyzer
          LDFLAGS_META=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            COMMIT="$(git rev-parse --short HEAD)"
            BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            LDFLAGS_META="-X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${COMMIT} -X ${PKG}.BuildDate=${BUILD_DATE}"
            echo "Stamping release build: version=${VERSION} commit=${COMMIT} date=${BUILD_DATE}"
          else
            echo "Non-tag build (ref_type=${GITHUB_REF_TYPE:-unset}); binaries keep dev/none/unknown sentinels"
          fi
          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
            "windows arm64"
          )
          for target in "${targets[@]}"; do
            read -r os arch <<<"${target}"
            package="spec-kitty-analyzer_${os}_${arch}"
            stage="dist/${package}"
            mkdir -p "${stage}/skills/spec-kitty-analyzer" "${stage}/install"
            cp README.md "${stage}/"
            compgen -G "LICENSE*" >/dev/null && cp LICENSE* "${stage}/" || true
            cp skills/spec-kitty-analyzer/SKILL.md "${stage}/skills/spec-kitty-analyzer/SKILL.md"
            cp install/install.sh install/install.ps1 "${stage}/install/"
            if [[ "${os}" == "windows" ]]; then
              CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath -ldflags="-s -w ${LDFLAGS_META}" -o "${stage}/spec-kitty-analyzer.exe" ./cmd/spec-kitty-analyzer
              (cd "${stage}" && zip -qr "../${package}.zip" .)
            else
              CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath -ldflags="-s -w ${LDFLAGS_META}" -o "${stage}/spec-kitty-analyzer" ./cmd/spec-kitty-analyzer
              chmod +x "${stage}/spec-kitty-analyzer" "${stage}/install/install.sh"
              tar -C "${stage}" -czf "dist/${package}.tar.gz" .
            fi
          done
          # Footgun guard (C-002): a wrong -X module path fails silently. On a tag
          # build the linux/amd64 binary must NOT still report 'dev'.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            ver_out="$(dist/spec-kitty-analyzer_linux_amd64/spec-kitty-analyzer version || true)"
            echo "verify injected version: ${ver_out}"
            case "${ver_out}" in
              *"dev (commit none"*)
                echo "::error::ldflags injection failed — binary still reports 'dev' (check the -X module path: ${PKG})"; exit 1;;
            esac
          fi
          cp install/install.sh dist/install.sh
          cp install/install.ps1 dist/install.ps1
          chmod +x dist/install.sh
          (cd dist && shasum -a 256 spec-kitty-analyzer_*.tar.gz spec-kitty-analyzer_*.zip install.sh install.ps1 > checksums.txt)

      - name: Release notes + triple-consistency guard
        shell: bash
        run: |
          set -euo pipefail
          # body_path (below) is unconditional, so the notes file must ALWAYS exist.
          # On a non-tag workflow_dispatch run it stays empty and we skip the gates.
          : > dist/RELEASE_NOTES.md
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Non-tag build (ref_type=${GITHUB_REF_TYPE:-unset}); empty release notes, skipping validate/extract/guard"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          # (1) tag <-> CHANGELOG parity + populated + monotonic (excludes the tag under release).
          go run ./tools/release validate --mode tag --tag "${TAG}"
          # (2) binary build.version == tag, read from the `version` command (field 2). Fail closed
          #     if the read is empty or not version-shaped (guards against output-format drift).
          bin_ver="$(dist/spec-kitty-analyzer_linux_amd64/spec-kitty-analyzer version | awk '{print $2}')"
          if [[ ! "${bin_ver}" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::could not read a version-shaped build.version from the binary (got '${bin_ver}')"; exit 1
          fi
          if [[ "${bin_ver}" != "${VER}" ]]; then
            echo "::error::triple-consistency failed: binary build.version (${bin_ver}) != tag (${VER})"; exit 1
          fi
          # (3) extract the CHANGELOG section as the GitHub Release body.
          go run ./tools/release extract "${VER}" > dist/RELEASE_NOTES.md
          echo "Triple-consistency OK: binary=${bin_ver} == tag=${VER} == CHANGELOG [${VER}]"

      - name: Upload release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/spec-kitty-analyzer_*.tar.gz
            dist/spec-kitty-analyzer_*.zip
            dist/install.sh
            dist/install.ps1
            dist/checksums.txt
          body_path: dist/RELEASE_NOTES.md
