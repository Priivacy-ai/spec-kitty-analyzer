    title: Architectural Integrity Standard (`DIRECTIVE_001`)
    description: 'Architectural Integrity Standard (`DIRECTIVE_001`): System designs must maintain clear separation of concerns and well-defined component boundaries so that each part of the system is independently understandable, testable, and replaceable without cascading changes.'
