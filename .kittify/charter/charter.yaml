    kind: directive
    title: Boy Scout Rule
    summary: "Leave touched areas in a better state by default. When an area already modified for the current task carries a failing test, lint, or type issue, fixing it is the default stance — not an optional nicety. Establishing whether a failure is pre-existing routinely costs more effort than simply fixing it, and litigating blame leaves the campground dirtier; so the default is to fix, and to defer only with an explicit rationale.\n"
    source_path: ''
    local_path: _LIBRARY/directive-directive-025.md
  - id: DIRECTIVE:DIRECTIVE_029
    kind: directive
    title: Agent Commit Signing Policy
    summary: "Agent-authored commits must avoid GPG or SSH signing in unattended workflows so automation does not fail on missing key material or unverifiable signatures.\n"
