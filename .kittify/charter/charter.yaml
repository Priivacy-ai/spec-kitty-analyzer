    references:
    - DIRECTIVE_001
  - id: DIR-002
    title: Decision Documentation Requirement (`DIRECTIVE_003
    description: 'Decision Documentation Requirement (`DIRECTIVE_003`): Material technical and governance decisions must be captured with enough context that future contributors can understand why a path was chosen and what constraints must remain true.'
    severity: warn
    references:
    - DIRECTIVE_003
  - id: DIR-003
    title: 'Locality of Change (`DIRECTIVE_024`): Changes shou'
    description: 'Locality of Change (`DIRECTIVE_024`): Changes should stay close to the problem being solved to reduce blast radius, simplify review, and lower regression risk.'
    severity: warn
    references:
    - DIRECTIVE_024
  - id: DIR-004
    title: 'Boy Scout Rule (`DIRECTIVE_025`): Leave touched ar'
    description: 'Boy Scout Rule (`DIRECTIVE_025`): Leave touched areas in a better state by default. When an area already modified for the current task carries a failing test, lint, or type issue, fixing it is the default stance — not an optional nicety. Establishing whether a failure is pre-existing routinely costs more effort than simply fixing it, and litigating blame leaves the campground dirtier; so the default is to fix, and to defer only with an explicit rationale.'
    severity: warn
    references:
    - DIRECTIVE_025
  - id: DIR-005
    title: 'Agent Commit Signing Policy (`DIRECTIVE_029`): Age'
    description: 'Agent Commit Signing Policy (`DIRECTIVE_029`): Agent-authored commits must avoid GPG or SSH signing in unattended workflows so automation does not fail on missing key material or unverifiable signatures.'
    severity: warn
    references:
    - DIRECTIVE_029
  - id: DIR-006
    title: 'Test and Typecheck Quality Gate (`DIRECTIVE_030`):'
    description: 'Test and Typecheck Quality Gate (`DIRECTIVE_030`): Code changes must pass the relevant automated tests and static validation gates before handoff so regressions and interface drift are caught early.'
    severity: warn
    references:
    - DIRECTIVE_030
  - id: DIR-007
    title: 'Targeted Staging Policy (`DIRECTIVE_033`): Agent-a'
    description: 'Targeted Staging Policy (`DIRECTIVE_033`): Agent-authored commits must stage only the expected deliverables for the current work package. Blanket staging commands that could inadvertently include unrelated changes, secrets, or build artefacts are prohibited.'
    severity: warn
    references:
    - DIRECTIVE_033
  - id: DIR-008
    title: 'Test-First Development (`DIRECTIVE_034`): Require '
    description: 'Test-First Development (`DIRECTIVE_034`): Require test-first behavior across acceptance and implementation layers, selecting tactics based on scope and risk. Tests define the contract before production code is written.'
    severity: warn
    references:
    - DIRECTIVE_034
  - id: DIR-009
    title: 'Black-Box Integration Testing (`DIRECTIVE_036`): E'
    description: 'Black-Box Integration Testing (`DIRECTIVE_036`): Exercise the system under test through its external interfaces only, without reference to its internal code structure, implementation details, or internal paths. Test cases derive from specifications, requirements, and design parameters, and assertions are made on observable outputs returned through those external interfaces. "Black-box" refers to the technique (absence of structural knowledge) and is independent of test scope — the scope is selected separately by responsibility, not by default to end-to-end.'
    severity: warn
    references:
    - DIRECTIVE_036
  - id: DIR-010
    title: 'Lynn Cole Engineering Culture (`DIRECTIVE_039`): C'
    description: "Lynn Cole Engineering Culture (`DIRECTIVE_039`): Constrain agentic implementation work toward test-first, strongly typed, modular, boring, reviewable code. Select this directive when the user names Lynn Cole's rules or expresses concern that coding agents produce excessive, bloated, clever, over-abstracted, or hard-to-review code."
    severity: warn
    references:
    - DIRECTIVE_039
  - id: DIR-011
    title: Recurring-Bug Structural-Intervention Discipline (
    description: 'Recurring-Bug Structural-Intervention Discipline (`DIRECTIVE_040`): When a bug class has recurred and prior reactive point-fixes have not stopped the chain, the next response must be a structural intervention that closes the class — not another point fix. Use the five-paradigm parallel-debugging tactic to identify the structural root cause, enumerate dormant masks, and author one fix plan that closes the whole class.'
    severity: warn
    references:
    - DIRECTIVE_040
  - id: DIR-012
    title: 'Respect risk boundaries: Privacy is non-negotiable'
    description: 'Respect risk boundaries: Privacy is non-negotiable: redaction must strip secrets from ingested logs, the tool is local-first, and it must never exfiltrate log contents. Adopt fail-safe practices to the degree they apply to privacy — when uncertain, default to not leaking. Detection precision matters: avoid false positives that erode user trust, validated evidence-first against real corpora.'
    severity: warn
    references: []
  - id: DIR-013
    title: Maintain comprehensive, customer-facing documentat
    description: "Maintain comprehensive, customer-facing documentation: README and docs/ stay in sync with shipped CLI behavior, and every new failure-mode detector is documented together with its recovery guidance. Maintain customer-facing documentation that makes clear the tool's purpose, usage, interpretation of results, and reporting options. Maintain a CHANGELOG using the same standards Spec Kitty uses (and, eventually, a parallel mechanism to Spec Kitty's). Maintain a CONTRIBUTING document detailing requirements, standard operating procedures, standards, and preferences, with explicit callouts for (a) an AI-assisted-contribution disclaimer and (b) a guard requiring discussion before large changes. Directional, not a hard gate: vector toward Divio documentation standards (tutorials, how-to guides, reference, explanation) as the scope warrants — the four modes map onto the customer-facing goal (purpose as explanation, usage as tutorial/how-to, interpretation as reference/explanation, reporting as how-to)."
    severity: warn
    references: []
